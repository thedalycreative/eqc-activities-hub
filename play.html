<!doctype html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join game</title><style>body{font:16px/1.5 system-ui;margin:0;background:#101828;color:#fff;padding:25px}.box{max-width:650px;margin:auto;background:#1d2939;border-radius:18px;padding:26px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit;margin-top:10px}input{border:1px solid #475467;background:#101828;color:#fff}button{border:0;background:#7f56d9;color:#fff;font-weight:800;cursor:pointer}.muted{color:#b4bfd0}.error{background:#5d2525;padding:14px;border-radius:10px;margin:15px 0}.content{margin-top:22px;background:#fff;color:#182033;border-radius:14px;padding:20px}</style></head><body><main class="box"><p class="muted">EQC ACTIVITIES</p><h1 id="title">Join game</h1><div id="error"></div><form id="join"><label>Your name<input name="name" required maxlength="40" placeholder="Your name"></label><button>Join lobby</button></form><div id="waiting" class="muted" hidden>You're in. Wait for the trainer to start.</div><div id="content" class="content" hidden></div></main><script type="module">import{ensureConnection,listenSession,joinSession,id}from'./activity-store.js';const el=id=>document.getElementById(id),params=new URLSearchParams(location.search),game=params.get('game')||'truths',code=(params.get('code')||'').toUpperCase(),presenter=params.get('presenter')==='1',titles={yearbook:'Yearbook wall',truths:'Two truths and a lie',slot:'Slot pick',emoji:'Emoji guess'},playerId=localStorage.getItem('eqc-player-id')||id('player');localStorage.setItem('eqc-player-id',playerId);el('title').textContent=titles[game]||'Game';try{await ensureConnection();await listenSession(code,state=>{if(!state.game){el('error').innerHTML='<div class="error">That game code is not active.</div>';return}if(state.players&&state.players[playerId]){el('join').hidden=true;el('waiting').hidden=state.status==='started';}if(state.status==='started'){el('join').hidden=true;el('waiting').hidden=true;el('content').hidden=false;el('content').innerHTML=presenter?`<h2>Presenter screen</h2><p>Game started with ${Object.keys(state.players||{}).length} players.</p>`:`<h2>You're playing!</h2><p>Stay on this screen and follow the trainer's instructions.</p>`}});el('join').onsubmit=async event=>{event.preventDefault();const name=new FormData(el('join')).get('name').trim();await joinSession(code,{id:playerId,name});el('join').hidden=true;el('waiting').hidden=false}}catch(e){el('error').innerHTML=`<div class="error">${e.message}<br><small>Run supabase-schema.sql in Supabase SQL Editor first.</small></div>`;el('join').hidden=true}</script></body></html>
