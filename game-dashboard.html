<!doctype html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game dashboard</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f6f7fb;color:#182033}.shell{max-width:960px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #e1e5ed;padding-bottom:20px}.card{background:#fff;border:1px solid #e1e5ed;border-radius:16px;padding:20px;margin-top:20px}.code{font-size:clamp(3rem,10vw,6rem);font-weight:900;letter-spacing:.15em;text-align:center;background:#eff1ff;border-radius:12px;padding:15px}.btn{padding:11px 15px;border-radius:9px;border:0;background:#635bff;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.muted{color:#667085}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.player{padding:12px;background:#f1f3f7;border-radius:10px;font-weight:700}.error{background:#fff1f1;border:1px solid #e8a6a6;padding:15px;border-radius:10px;color:#8f2525}</style></head><body><main class="shell"><div class="top"><div><p class="muted">TRAINER PRESENTER</p><h1 id="title">Starting game…</h1></div><a class="btn" href="/dashboard.html">All games</a></div><div id="error"></div><section class="card"><p class="muted">Students scan this QR code or enter the join link. They stay in the lobby until you start.</p><div id="qr"></div><div class="code" id="code">----</div><p id="joinLink" style="text-align:center"></p><button class="btn" id="start">Start game</button></section><section class="card"><h2>Players joined <span id="count">0</span></h2><div class="players" id="players"><p class="muted">Waiting for players…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script type="module">import{ensureConnection,createSession,listenSession,setSessionStatus,makeCode}from'./activity-store.js';const el=id=>document.getElementById(id),game=new URLSearchParams(location.search).get('game')||'truths',names={yearbook:'Yearbook wall',truths:'Two truths and a lie',slot:'Slot pick',emoji:'Emoji guess'},code=makeCode(),join=`${location.origin}/play.html?game=${game}&code=${code}`;el('title').textContent=names[game]||'Game';el('code').textContent=code;el('joinLink').innerHTML=`Join link: <a href="${join}">${join}</a>`;QRCode.toCanvas(join,{width:220},(err,canvas)=>{if(!err)el('qr').append(canvas)});try{await ensureConnection();await createSession(game,code);await listenSession(code,state=>{const list=Object.values(state.players||{});el('count').textContent=list.length;el('players').innerHTML=list.length?list.map(p=>`<div class="player">${String(p.name).replace(/[&<>"']/g,'')}</div>`).join(''):'<p class="muted">Waiting for players…</p>'});el('start').onclick=async()=>{await setSessionStatus(code,'started');location.href=`/play.html?game=${game}&code=${code}&presenter=1`}}catch(e){el('error').innerHTML=`<div class="error">${e.message}<br><small>Run supabase-schema.sql in Supabase SQL Editor first.</small></div>`;el('start').disabled=true}</script></body></html>
