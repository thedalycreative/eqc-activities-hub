<!DOCTYPE html>
<!--
  FLEXBOX STARTER FILE — open this in VS Code and run it with Live Server
  (or just double-click it to open in a browser and refresh after saving).

  Nothing here uses Flexbox yet. That's the point — students see the
  "broken" default layout first, then you type the flex properties into
  the empty rule blocks below, live, one line at a time.

  Follow flexbox_typing_script.md for exactly what to type and when.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flexbox Practice</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 60px;
      max-width: 900px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 70px;
    }

    h2 {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }


    /* ============================================
     1. CENTER A DIV
     ============================================ */

    .ex1-container {
      height: 400px;
      border: 2px dashed #999;
      display: flex;
      justify-content: center;
      align-items: center;



    }

    .ex1-box {
      width: 200px;
      height: 200px;
      background: #2EC4B6;
      border-radius: 8px;
    }


    /* ============================================
     2. NAVBAR
     ============================================ */

    .navbar {
      background: #1B2430;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 60px;
      /* 👇 type here */

    }

    .navbar .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .navbar .links {
      /* 👇 type here (later step) */

    }

    .navbar .links a {
      color: white;
      text-decoration: none;
      margin-right: 10px;
    }


    /* ============================================
     3. RESPONSIVE CARD ROW
     ============================================ */

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .practice-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      padding: 18px;
      margin-bottom: 18px;
      background: #eef4ff;
      border: 1px solid #c7d7f5;
      border-radius: 10px;
    }

    .practice-controls label { display: grid; gap: 5px; font-weight: bold; }
    .practice-controls select { padding: 8px; font: inherit; }

    .card {
      background: #3A86FF;
      color: white;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      width: 150px;
    }
  </style>

</head>

<body>

  <h1>Flexbox Practice</h1>

  <section>
    <h2>1. Center a Div</h2>
    <div class="ex1-container">
      <div class="ex1-box"></div>
    </div>
  </section>

  <section>
    <h2>2. Navbar</h2>
    <div class="navbar">
      <div class="logo">MyLogo</div>
      <div class="links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </section>

  <section>
    <h2>3. Responsive Card Row</h2>
    <div class="practice-controls">
      <label>Direction
        <select id="direction"><option>row</option><option>column</option></select>
      </label>
      <label>Justify content
        <select id="justify"><option>flex-start</option><option>center</option><option>space-between</option><option>space-around</option></select>
      </label>
      <label>Align items
        <select id="align"><option>stretch</option><option>center</option><option>flex-start</option><option>flex-end</option></select>
      </label>
      <button id="resetFlex" type="button">Reset</button>
    </div>
    <div class="cards">
      <div class="card">1</div>
      <div class="card">2</div>
      <div class="card">3</div>
      <div class="card">4</div>
      <div class="card">5</div>
    </div>
  </section>

  <script>
    const cards = document.querySelector('.cards');
    const controls = ['direction', 'justify', 'align'].map(id => document.getElementById(id));
    controls.forEach(control => control.addEventListener('change', () => {
      cards.style.flexDirection = direction.value;
      cards.style.justifyContent = justify.value;
      cards.style.alignItems = align.value;
    }));
    resetFlex.addEventListener('click', () => {
      direction.value = 'row'; justify.value = 'flex-start'; align.value = 'stretch';
      cards.style.flexDirection = 'row'; cards.style.justifyContent = 'flex-start'; cards.style.alignItems = 'stretch';
    });
  </script>

</body>

</html>
