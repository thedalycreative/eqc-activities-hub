<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      .card { fill: white; stroke: #dee2e6; stroke-width: 1; }
      .label { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; fill: #1d1d1f; font-weight: 600; }
      .desc { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; fill: #6c757d; }
      .badge { font-family: monospace; font-size: 10px; fill: white; font-weight: 600; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.1)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f5f5f7"/>

  <!-- Title -->
  <text x="400" y="35" font-family="-apple-system, system-ui, sans-serif" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="middle">
    Bootstrap Components Cycle
  </text>

  <!-- Card 1: Navbar -->
  <g transform="translate(50, 80)">
    <rect class="card" x="0" y="0" width="160" height="160" rx="12" filter="url(#shadow)"/>
    <rect x="0" y="0" width="160" height="36" rx="12" fill="#1d1d1f">
      <animate attributeName="fill" values="#1d1d1f;#0d6efd;#1d1d1f;#1d1d1f;#1d1d1f;#1d1d1f" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="20" cy="18" r="4" fill="white"/>
    <rect x="40" y="14" width="40" height="8" rx="2" fill="white" opacity="0.6"/>
    <rect x="90" y="14" width="40" height="8" rx="2" fill="white" opacity="0.6"/>
    <text x="80" y="80" class="label" text-anchor="middle">Navbar</text>
    <text x="80" y="100" class="desc" text-anchor="middle">Sticky navigation</text>
    <text x="80" y="115" class="desc" text-anchor="middle">Responsive collapse</text>
    <rect x="50" y="130" width="60" height="18" rx="9" fill="#0d6efd"/>
    <text x="80" y="143" class="badge" text-anchor="middle">component</text>
  </g>

  <!-- Card 2: Carousel -->
  <g transform="translate(230, 80)">
    <rect class="card" x="0" y="0" width="160" height="160" rx="12" filter="url(#shadow)"/>
    <rect x="0" y="0" width="160" height="100" fill="#0071e3" rx="12">
      <animate attributeName="fill" values="#0071e3;#5e5ce6;#34c759;#ff9500;#0071e3" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="65" cy="92" r="3" fill="white" opacity="0.6"/>
    <circle cx="80" cy="92" r="3" fill="white">
      <animate attributeName="opacity" values="0.6;1;0.6;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="92" r="3" fill="white" opacity="0.6"/>
    <text x="80" y="125" class="label" text-anchor="middle">Carousel</text>
    <text x="80" y="142" class="desc" text-anchor="middle">Image slideshow</text>
    <rect x="50" y="148" width="60" height="6" rx="3" fill="#0d6efd" opacity="0.3"/>
  </g>

  <!-- Card 3: Form -->
  <g transform="translate(410, 80)">
    <rect class="card" x="0" y="0" width="160" height="160" rx="12" filter="url(#shadow)"/>
    <rect x="20" y="20" width="120" height="20" rx="4" fill="#f8f9fa" stroke="#ced4da"/>
    <rect x="22" y="22" width="0" height="16" fill="#0d6efd">
      <animate attributeName="width" values="0;80;80;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="50" width="120" height="20" rx="4" fill="#f8f9fa" stroke="#ced4da"/>
    <rect x="20" y="80" width="120" height="30" rx="6" fill="#0d6efd"/>
    <text x="80" y="100" font-family="-apple-system" font-size="12" fill="white" font-weight="600" text-anchor="middle">Submit</text>
    <text x="80" y="135" class="label" text-anchor="middle">Forms</text>
    <text x="80" y="150" class="desc" text-anchor="middle">Validation built-in</text>
  </g>

  <!-- Card 4: Modal -->
  <g transform="translate(590, 80)">
    <rect class="card" x="0" y="0" width="160" height="160" rx="12" filter="url(#shadow)"/>
    <rect x="0" y="0" width="160" height="160" rx="12" fill="rgba(0,0,0,0.4)">
      <animate attributeName="opacity" values="0;1;1;1;0;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="35" width="110" height="90" rx="8" fill="white" stroke="#dee2e6">
      <animate attributeName="y" values="160;35;35;35;160;160" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="60" font-family="-apple-system" font-size="11" fill="#1d1d1f" font-weight="600" text-anchor="middle">
      <animate attributeName="y" values="190;60;60;60;190;190" dur="6s" repeatCount="indefinite"/>
      Modal Title
    </text>
    <line x1="40" y1="70" x2="120" y2="70" stroke="#dee2e6">
      <animate attributeName="y1" values="200;70;70;70;200;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;70;70;70;200;200" dur="6s" repeatCount="indefinite"/>
    </line>
    <text x="80" y="138" class="label" text-anchor="middle" fill="#1d1d1f">
      <tspan>Modal</tspan>
    </text>
  </g>

  <!-- Footer note -->
  <text x="400" y="280" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">
    30+ components • 8 demo pages • only 48 lines of custom CSS
  </text>
</svg>
