<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .swatch-label { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .code-label { font-family: monospace; font-size: 10px; text-anchor: middle; fill: white; opacity: 0.9; }
    </style>
  </defs>

  <text x="400" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="18" fill="#1d1d1f" font-weight="700" text-anchor="middle">
    Bootstrap Theme Colours
  </text>

  <!-- Color swatches that animate in sequence -->
  <g>
    <rect x="20" y="60" width="90" height="90" rx="12" fill="#0d6efd">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0s" fill="freeze"/>
    </rect>
    <text x="65" y="170" class="swatch-label" fill="#1d1d1f">primary</text>
    <text x="65" y="113" class="code-label">#0d6efd</text>
  </g>

  <g>
    <rect x="115" y="60" width="90" height="90" rx="12" fill="#6c757d">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="160" y="170" class="swatch-label" fill="#1d1d1f">secondary</text>
    <text x="160" y="113" class="code-label">#6c757d</text>
  </g>

  <g>
    <rect x="210" y="60" width="90" height="90" rx="12" fill="#198754">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="255" y="170" class="swatch-label" fill="#1d1d1f">success</text>
    <text x="255" y="113" class="code-label">#198754</text>
  </g>

  <g>
    <rect x="305" y="60" width="90" height="90" rx="12" fill="#dc3545">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="350" y="170" class="swatch-label" fill="#1d1d1f">danger</text>
    <text x="350" y="113" class="code-label">#dc3545</text>
  </g>

  <g>
    <rect x="400" y="60" width="90" height="90" rx="12" fill="#ffc107">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="445" y="170" class="swatch-label" fill="#1d1d1f">warning</text>
    <text x="445" y="113" class="code-label" fill="#000" opacity="0.7">#ffc107</text>
  </g>

  <g>
    <rect x="495" y="60" width="90" height="90" rx="12" fill="#0dcaf0">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="540" y="170" class="swatch-label" fill="#1d1d1f">info</text>
    <text x="540" y="113" class="code-label">#0dcaf0</text>
  </g>

  <g>
    <rect x="590" y="60" width="90" height="90" rx="12" fill="#f8f9fa" stroke="#dee2e6">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="635" y="170" class="swatch-label" fill="#1d1d1f">light</text>
    <text x="635" y="113" class="code-label" fill="#999">#f8f9fa</text>
  </g>

  <g>
    <rect x="685" y="60" width="90" height="90" rx="12" fill="#212529">
      <animate attributeName="height" values="0;90;90;90;90;90;90;90;90" dur="3s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="730" y="170" class="swatch-label" fill="#1d1d1f">dark</text>
    <text x="730" y="113" class="code-label">#212529</text>
  </g>
</svg>
