<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .col { fill: #0d6efd; stroke: #0a58ca; stroke-width: 1; }
      .label { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; fill: white; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .title { font-family: -apple-system, system-ui, sans-serif; font-size: 16px; fill: #1d1d1f; font-weight: 700; }
    </style>
  </defs>

  <text x="20" y="25" class="title">Bootstrap 12-Column Responsive Grid</text>

  <!-- Mobile (xs) - all stacked -->
  <g>
    <rect x="20" y="50" width="760" height="40" class="col" rx="4">
      <animate attributeName="width" values="760;380;253;190" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="70" class="label">
      <animate attributeName="x" values="400;210;147;115" dur="4s" repeatCount="indefinite"/>
      col-12 / col-md-6 / col-lg-4 / col-xl-3
    </text>
  </g>

  <!-- Tablet (md) - duplicate to show 6+6 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;1" dur="4s" repeatCount="indefinite"/>
    <rect x="400" y="50" width="380" height="40" class="col" rx="4" fill="#6610f2">
      <animate attributeName="opacity" values="0;0;1;1;1;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Show third + fourth col when at lg/xl -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1" dur="4s" repeatCount="indefinite"/>
    <rect x="273" y="50" width="253" height="40" class="col" rx="4" fill="#198754"/>
    <rect x="526" y="50" width="253" height="40" class="col" rx="4" fill="#dc3545"/>
  </g>

  <text x="20" y="120" class="title">Responsive Breakpoint Animation:</text>
  <text x="20" y="145" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#666">
    <animate attributeName="textContent" values="📱 xs (&lt; 576px) — col-12 stacks;💻 md (≥ 768px) — col-md-6 side by side;🖥 lg (≥ 992px) — col-lg-4 in three;🖥 xl (≥ 1200px) — col-xl-3 in four" dur="4s" repeatCount="indefinite"/>
    📱 xs (&lt; 576px) — full width col-12
  </text>

  <!-- Bottom progress bar showing breakpoint transitions -->
  <rect x="20" y="170" width="760" height="6" fill="#e9ecef" rx="3"/>
  <rect x="20" y="170" width="190" height="6" fill="#0d6efd" rx="3">
    <animate attributeName="width" values="190;380;570;760;190" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="190" font-family="monospace" font-size="11" fill="#999">xs</text>
  <text x="220" y="190" font-family="monospace" font-size="11" fill="#999">md</text>
  <text x="420" y="190" font-family="monospace" font-size="11" fill="#999">lg</text>
  <text x="620" y="190" font-family="monospace" font-size="11" fill="#999">xl</text>
</svg>
