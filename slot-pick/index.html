<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slot pick · Add a name</title><style>body{font:16px/1.5 system-ui;background:#eff8ff;color:#12233c;margin:0;padding:30px}.box{max-width:620px;margin:auto;background:#fff;border:1px solid #cfe4f7;border-radius:18px;padding:28px;box-shadow:0 12px 30px #12233c12}h1{letter-spacing:-.04em}input{width:100%;padding:12px;border:1px solid #bccddd;border-radius:9px;font:inherit}button{margin-top:12px;padding:11px 15px;border:0;border-radius:9px;background:#1878d1;color:#fff;font-weight:800;cursor:pointer}.names{display:grid;gap:8px;margin-top:20px}.name{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f1f6fb;border-radius:9px}.name button{margin:0;background:#dce6f0;color:#12233c;padding:6px 10px}a{color:#1878d1}.status{color:#167a63}</style></head><body><main class="box"><p><a href="/dashboard.html">← Trainer dashboard</a></p><h1>🎰 Join Slot Pick</h1><p>Add your name to the live class list. The trainer will pick from the dashboard.</p><form id="form"><input name="name" required placeholder="Your name"><button>Add me</button></form><div class="names" id="names"></div><p class="status" id="status"></p></main><script type="module">import{paths,listen,write,removeAt,id}from'../activity-store.js';let data={};const render=()=>names.innerHTML=Object.values(data).map(n=>`<div class="name"><strong>${n.name.replace(/[&<>"']/g,'')}</strong><button data-id="${n.id}">Remove</button></div>`).join('')||'<p>No names yet.</p>';listen(paths.slot,d=>{data=d;render()});form.onsubmit=async e=>{e.preventDefault();const name=new FormData(form).get('name').trim();if(!name)return;const item={id:id('name'),name,picks:0};await write(`${paths.slot}/${item.id}`,item);form.reset();status.textContent='You are on the list.'};names.onclick=e=>{const b=e.target.closest('button');if(b)removeAt(`${paths.slot}/${b.dataset.id}`)}</script></body></html>
