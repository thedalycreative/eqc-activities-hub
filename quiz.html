<!doctype html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia Live</title><style>:root{--ink:#172033;--purple:#635bff;--paper:#f5f7fb;--line:#e2e6ee;--green:#16a394;--red:#e9506b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.shell{max-width:1100px;margin:auto;padding:25px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}h1,h2,h3,p{margin:0}.eyebrow{font-size:12px;color:var(--purple);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.muted{color:#667085}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 10px 30px #1720330a}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e9ecf5;color:var(--ink)}.btn.danger{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.category{display:flex;gap:8px;align-items:center;padding:10px;background:#f2f4f8;border-radius:9px}.category input{accent-color:var(--purple)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.choice{border:3px solid #e2e6ee;background:#fff;color:var(--ink);border-radius:14px;padding:18px;text-align:left;font-size:1.05rem;font-weight:800;cursor:pointer}.choice:hover,.choice.selected{border-color:var(--purple);background:#f1f0ff}.choice.correct{border-color:var(--green);background:#e7faf5}.choice.wrong{border-color:var(--red);background:#fff0f2}.question{font-size:clamp(1.5rem,4vw,3rem);font-weight:900;line-height:1.1;margin-top:12px}.timer{font-size:2rem;font-weight:900;color:var(--red)}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.players{display:flex;flex-wrap:wrap;gap:8px}.player{padding:8px 12px;background:#eef1f6;border-radius:999px;font-weight:700}.player.done{background:#d9f7ed;color:#086b5c}.error{background:#fff0f2;color:#8d2032;padding:14px;border-radius:10px;margin-top:15px}.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:10px;text-align:center}.podium div{background:#f3f4fb;border-radius:12px;padding:18px 8px;font-weight:900}.podium div:first-child{order:2;padding-bottom:35px;background:#fff2bf}.podium div:nth-child(2){order:1}.podium div:nth-child(3){order:3}@media(max-width:600px){.choices{grid-template-columns:1fr}header{display:block}.topline{margin-top:12px}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">EQC Trivia Live</div><h1 id="heading">Set up a game</h1><p class="muted" id="subheading">Kahoot-style classroom trivia</p></div><a class="btn secondary" href="/">Hub home</a></header><div id="app"></div></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script type="module">
import QRCode from 'https://esm.sh/qrcode@1.5.3';
import { categories, makeQuizQuestions } from './quiz-bank.js';
import { createSession, ensureConnection, id, joinSession, listen, listenSession, makeCode, setSessionStatus, write } from './activity-store.js';
const app=document.getElementById('app'), heading=document.getElementById('heading'), subheading=document.getElementById('subheading'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search), code=(params.get('code')||'').toUpperCase(), mode=params.get('mode')||'presenter', playerId=localStorage.getItem('quiz-player-id')||id('player'); localStorage.setItem('quiz-player-id',playerId);
let session={}, quizState={}, quizRows={}, playerName='', timer;
const activity=code=>`quiz-${code}`;
const scoreFor=(answer,question)=>answer&&question&&question.correct===answer.choice?1000+Math.max(0,Math.round(1000*(1-(answer.elapsed/60000)))):0;
function renderSetup(){heading.textContent='Create a trivia round';subheading.textContent='Choose up to five categories and a round length.';app.innerHTML=`<section class="card"><h2>Categories <span class="muted" id="categoryCount">0/5</span></h2><div class="grid" id="categories">${categories.map(c=>`<label class="category"><input type="checkbox" value="${esc(c)}"> ${esc(c)}</label>`).join('')}</div><h2 style="margin-top:24px">Questions</h2><div class="grid" id="rounds">${[5,10,15,20].map(n=>`<label class="category"><input type="radio" name="count" value="${n}" ${n===5?'checked':''}> ${n} questions</label>`).join('')}</div><p id="setupError" class="error" hidden></p><button class="btn" id="create">Start lobby</button></section>`;const boxes=[...document.querySelectorAll('#categories input')], count=()=>{const n=boxes.filter(x=>x.checked).length;document.getElementById('categoryCount').textContent=`${n}/5`;boxes.forEach(x=>x.disabled=!x.checked&&n>=5)};boxes.forEach(x=>x.onchange=count);document.getElementById('create').onclick=startLobby}
async function startLobby(){const selected=[...document.querySelectorAll('#categories input:checked')].map(x=>x.value),number=Number(document.querySelector('input[name=count]:checked').value),err=document.getElementById('setupError');try{if(!selected.length)return err.removeAttribute('hidden'),err.textContent='Choose at least one category.';const questions=makeQuizQuestions(selected,number),newCode=makeCode();await ensureConnection();await createSession('trivia',newCode);await write(`${activity(newCode)}/state`,{status:'lobby',game:'trivia',categories:selected,questions,questionIndex:-1,questionStartedAt:null,scores:{}});location.href=`/quiz.html?mode=presenter&code=${newCode}`}catch(e){err.removeAttribute('hidden');err.textContent=e.message}}
function renderPresenterLobby(){heading.textContent='Trivia lobby';subheading.textContent=`Game code: ${code}`;app.innerHTML=`<section class="card"><div class="topline"><div><h2>Scan to join</h2><p class="muted">Players enter their name and wait here until you start.</p></div><button class="btn" id="startGame">Start game</button></div><div id="qr" style="text-align:center;margin:15px"></div><div style="font-size:4rem;font-weight:900;text-align:center;letter-spacing:.2em">${code}</div><p style="text-align:center"><a id="joinLink"></a></p></section><section class="card"><h2>Players <span id="playerCount">0</span></h2><div class="players" id="players"></div></section>`;const link=`${location.origin}/quiz.html?mode=player&code=${code}`;document.getElementById('joinLink').href=link;document.getElementById('joinLink').textContent=link;QRCode.toCanvas(link,{width:220},(_,canvas)=>{if(canvas)document.getElementById('qr').append(canvas)});document.getElementById('startGame').onclick=()=>startQuestion(0)}
async function startQuestion(index){await write(`${activity(code)}/state`,{...quizState,status:'question',questionIndex:index,questionStartedAt:Date.now()})}
function renderQuestion(){const question=quizState.questions[quizState.questionIndex];if(!question)return;heading.textContent=`Question ${quizState.questionIndex+1} of ${quizState.questions.length}`;subheading.textContent=quizState.categories.join(' · ');app.innerHTML=`<section class="card"><div class="topline"><span class="timer" id="timer">60</span><span class="muted">${Object.values(session.players||{}).length} players</span></div><div class="question">${esc(question.question)}</div><div class="choices">${question.answers.map((a,i)=>`<div class="choice">${String.fromCharCode(65+i)} · ${esc(a)}</div>`).join('')}</div><p class="muted" style="margin-top:18px">Answers received: ${Object.keys(quizRows).filter(k=>k.startsWith('answer-')&&quizRows[k].questionIndex===quizState.questionIndex).length}</p><div style="display:flex;gap:10px;margin-top:18px"><button class="btn secondary" id="pause">Pause</button><button class="btn" id="reveal">Reveal answer</button><button class="btn danger" id="end">End game</button></div></section>`;clearInterval(timer);const started=quizState.questionStartedAt||Date.now();timer=setInterval(()=>{const left=Math.max(0,60-Math.floor((Date.now()-started)/1000));document.getElementById('timer').textContent=left;if(!left){clearInterval(timer);reveal()}},250);document.getElementById('pause').onclick=()=>write(`${activity(code)}/state`,{...quizState,status:'paused'});document.getElementById('reveal').onclick=reveal;document.getElementById('end').onclick=()=>write(`${activity(code)}/state`,{...quizState,status:'finished'})}
async function reveal(){clearInterval(timer);await write(`${activity(code)}/state`,{...quizState,status:'reveal'})}
function renderReveal(){const question=quizState.questions[quizState.questionIndex];heading.textContent='Reveal';subheading.textContent='Review the answer, then continue.';app.innerHTML=`<section class="card"><div class="question">${esc(question.question)}</div><div class="choices">${question.answers.map((a,i)=>`<div class="choice ${i===question.correct?'correct':''}">${String.fromCharCode(65+i)} · ${esc(a)} ${i===question.correct?'✓':''}</div>`).join('')}</div><p style="margin-top:18px">${esc(question.explanation)}</p><button class="btn" id="next">${quizState.questionIndex+1===quizState.questions.length?'Show final results':'Next question'}</button></section>`;document.getElementById('next').onclick=()=>quizState.questionIndex+1===quizState.questions.length?write(`${activity(code)}/state`,{...quizState,status:'finished'}):startQuestion(quizState.questionIndex+1)}
function renderFinished(){const scores=Object.values(session.players||{}).map(player=>({name:player.name,score:Object.values(quizRows).filter(x=>x.playerId===player.id).reduce((sum,x)=>sum+scoreFor(x,quizState.questions[x.questionIndex]),0)})).sort((a,b)=>b.score-a.score);heading.textContent='Final results';subheading.textContent='Reveal the leaderboard when you are ready.';app.innerHTML=`<section class="card"><h2>Podium</h2><div class="podium">${scores.slice(0,3).map(x=>`<div>${esc(x.name)}<br>${x.score.toLocaleString()} pts</div>`).join('')}</div><h2 style="margin-top:24px">Full leaderboard</h2>${scores.map((x,i)=>`<p style="padding:10px 0;border-bottom:1px solid #e2e6ee"><strong>${i+1}. ${esc(x.name)}</strong><span style="float:right">${x.score.toLocaleString()}</span></p>`).join('')}</section>`}
function renderPlayer(){heading.textContent='Join trivia';subheading.textContent=`Game code: ${code}`;app.innerHTML=`<section class="card"><form id="join"><h2>Enter the lobby</h2><input name="name" maxlength="30" required placeholder="Your name" style="width:100%;padding:13px;border:1px solid #ccd2df;border-radius:9px;margin:15px 0;font:inherit"><button class="btn">Join game</button></form><p id="joinError" class="error" hidden></p><div id="waiting" hidden><h2>You're in!</h2><p class="muted">Wait for the trainer to start the game.</p></div><div id="playerGame" hidden></div></section>`;document.getElementById('join').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),error=document.getElementById('joinError');playerName=new FormData(form).get('name').trim();if(!playerName)return;button.disabled=true;button.textContent='Joining…';try{await joinSession(code,{id:playerId,name:playerName});form.hidden=true;document.getElementById('waiting').hidden=false}catch(errorValue){error.hidden=false;error.textContent=errorValue.message||'Could not join this game. Check the game code and try again.';button.disabled=false;button.textContent='Join game'}}}
function renderPlayerQuestion(){const question=quizState.questions[quizState.questionIndex],answer=quizRows[`answer-${playerId}-${quizState.questionIndex}`];heading.textContent=`Question ${quizState.questionIndex+1}`;subheading.textContent='Choose one answer';const game=document.getElementById('playerGame');game.hidden=false;document.getElementById('waiting').hidden=true;game.innerHTML=`<div class="timer" id="playerTimer">60</div><div class="question">${esc(question.question)}</div><div class="choices">${question.answers.map((a,i)=>`<button class="choice ${answer&&answer.choice===i?'selected':''}" data-choice="${i}" ${answer?'disabled':''}>${String.fromCharCode(65+i)} · ${esc(a)}</button>`).join('')}</div><p class="muted" style="margin-top:15px">${answer?'Answer received ✓':'You can only answer once.'}</p>`;if(!answer)game.querySelectorAll('[data-choice]').forEach(button=>button.onclick=async()=>{const elapsed=Math.min(60000,Date.now()-(quizState.questionStartedAt||Date.now()));await write(`${activity(code)}/answer-${playerId}-${quizState.questionIndex}`,{playerId,questionIndex:quizState.questionIndex,choice:Number(button.dataset.choice),elapsed,answeredAt:Date.now()});renderPlayerQuestion()})}
function renderState(){if(mode==='presenter'){if(quizState.status==='lobby')renderPresenterLobby();else if(quizState.status==='question')renderQuestion();else if(quizState.status==='reveal')renderReveal();else if(quizState.status==='finished')renderFinished();else if(quizState.status==='paused'){heading.textContent='Paused';app.innerHTML='<section class="card"><h2>Game paused</h2><button class="btn" id="resume">Resume</button></section>';document.getElementById('resume').onclick=()=>startQuestion(quizState.questionIndex)}}else if(quizState.status==='question')renderPlayerQuestion();else if(quizState.status==='reveal'){const q=quizState.questions[quizState.questionIndex],a=quizRows[`answer-${playerId}-${quizState.questionIndex}`];document.getElementById('playerGame').innerHTML=`<h2>Answer revealed</h2><p>The correct answer was <strong>${esc(q.answers[q.correct])}</strong>.</p><p>${esc(q.explanation)}</p><p>You earned <strong>${scoreFor(a,q).toLocaleString()} points</strong>.</p>`}else if(quizState.status==='finished'){document.getElementById('playerGame').innerHTML='<h2>Game complete!</h2><p>Look at the presenter screen for the podium.</p>'}}
async function boot(){if(mode==='presenter'&&!code){renderSetup();return}try{await ensureConnection();if(mode==='player')renderPlayer();await listenSession(code,data=>{session=data;const players=Object.values(data.players||{});if(mode==='presenter'&&document.getElementById('players')){document.getElementById('players').innerHTML=players.map(p=>`<span class="player">${esc(p.name)}</span>`).join('');document.getElementById('playerCount').textContent=players.length}renderState()});await listen(activity(code),data=>{quizRows=data;if(data.state){quizState=data.state;renderState()}})}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}<br>Check that the Supabase schema has been run.</div>`}}
boot();
</script></body></html>
