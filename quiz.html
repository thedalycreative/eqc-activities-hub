<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia Live · EQC Activities Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/hub.css">
  <style>
    .trivia-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; }
    .trivia-title { font-family: var(--display); font-size: clamp(1.6rem, 3.6vw, 2.6rem); text-shadow: 0 4px 0 var(--ink); }
    .trivia-sub { font-weight: 800; font-size: 1.1rem; opacity: .85; }
    .mute-btn { width: 44px; min-height: 44px; font-size: 1.15rem; box-shadow: 0 4px 0 var(--ink); }

    /* Setup */
    .cat-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .cat-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 4px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; cursor: pointer; user-select: none; }
    .cat-chip:has(input:checked) { background: var(--bulb); }
    .cat-chip:has(input:disabled) { opacity: .45; cursor: not-allowed; }
    .cat-chip input { width: 18px; height: 18px; accent-color: var(--ink); }
    .count-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .count-row label { display: inline-flex; gap: 8px; align-items: center; padding: 6px 16px 4px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 999px; cursor: pointer; }
    .count-row label:has(input:checked) { background: var(--teal); }
    .time-chip { min-height: 40px; padding: 4px 18px 2px; }
    .setup-section + .setup-section { margin-top: 22px; }
    .setup-section h2 { font-size: 1.4rem; }

    /* Lobby */
    .lobby { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 24px; align-items: start; }
    .lobby .qr { width: min(60vw, 330px); }
    .lobby-players { display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; }
    .lobby-chip { padding: 4px 16px 2px; font-weight: 800; font-size: 1.2rem; background: var(--bulb); border: 3px solid var(--ink); border-radius: 999px; animation: pop-in .35s cubic-bezier(.2, 1.4, .4, 1) both, bounce 1.6s ease-in-out .4s infinite; overflow-wrap: anywhere; }
    .lobby-chip:nth-child(3n+2) { background: var(--pink); animation-delay: 0s, .6s; }
    .lobby-chip:nth-child(3n) { background: var(--teal); animation-delay: 0s, 1.1s; }
    .big-count { font-family: var(--display); font-size: 3rem; line-height: 1; }

    /* Question (presenter) */
    .q-meta { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; font-weight: 800; font-size: 1.15rem; }
    .q-main { display: flex; align-items: center; gap: 24px; margin: 16px 0 24px; }
    .question { flex: 1; padding: 22px 28px 18px; font-weight: 800; font-size: clamp(1.6rem, 3.8vw, 3rem); line-height: 1.12; color: var(--ink); background: var(--paper); border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); overflow-wrap: anywhere; }
    .timer-ring { --left: 1; display: grid; place-items: center; width: 130px; height: 130px; flex: none; border: 5px solid var(--ink); border-radius: 50%; background: conic-gradient(var(--tomato) calc(var(--left) * 360deg), var(--paper) 0); box-shadow: 0 6px 0 var(--ink); }
    .timer-ring .num { display: grid; place-items: center; width: 84px; height: 84px; font-family: var(--display); font-size: 2.2rem; color: var(--ink); background: var(--paper); border: 4px solid var(--ink); border-radius: 50%; }
    .timer-ring.hurry .num { animation: pulse .5s ease-in-out infinite; color: var(--tomato); }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .answer-tile { display: flex; align-items: center; gap: 16px; min-height: 96px; padding: 16px 22px; font-weight: 800; font-size: clamp(1.2rem, 2.4vw, 1.9rem); line-height: 1.15; color: var(--ink); background: var(--c); border: 5px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); overflow-wrap: anywhere; }
    .answer-tile .shape-icon { width: 1.5em; height: 1.5em; }
    .answer-count { margin-top: 18px; text-align: center; font-weight: 800; font-size: 1.3rem; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    .q-intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(14, 8, 36, .88); }
    .q-intro .n { font-family: var(--display); font-size: clamp(8rem, 30vw, 18rem); color: var(--bulb); text-shadow: 0 10px 0 var(--ink); animation: pop-in .5s cubic-bezier(.2, 1.4, .4, 1) both; }
    .q-intro .lbl { font-weight: 800; font-size: 1.6rem; text-align: center; }

    /* Reveal */
    .answer-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end; height: 240px; margin: 10px 0 18px; }
    .answer-bar { display: grid; grid-template-rows: auto 1fr; gap: 6px; height: 100%; text-align: center; }
    .answer-bar .count { font-family: var(--display); font-size: 2rem; }
    .answer-bar .fill { align-self: end; height: calc(var(--h) * 100%); min-height: 16px; background: var(--c); border: 5px solid var(--ink); border-bottom: 0; border-radius: 16px 16px 0 0; transform-origin: bottom; animation: grow .7s cubic-bezier(.2, 1.2, .4, 1) both; }
    .answer-bar:not(.correct) .fill { opacity: .45; }
    .answer-bar.correct .count::after { content: " ✓"; color: var(--lime); }
    @keyframes grow { from { transform: scaleY(0); } }
    .answer-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .answer-list .answer-tile { min-height: 64px; font-size: clamp(1rem, 1.8vw, 1.4rem); }
    .answer-list .answer-tile:not(.correct) { opacity: .45; }
    .answer-list .answer-tile.correct::after { content: "✓"; margin-left: auto; font-size: 1.8em; }
    .explain { margin-top: 16px; font-weight: 700; font-size: 1.2rem; }

    /* Leaderboard */
    .lb { max-width: 820px; margin: 0 auto; display: grid; gap: 12px; }
    .lb-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; padding: 12px 18px 8px; font-weight: 800; font-size: clamp(1.2rem, 2.4vw, 1.8rem); color: var(--ink); background: var(--paper); border: 5px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink); }
    .lb-row:first-child { background: var(--bulb); }
    .lb-row .rank { display: grid; place-items: center; width: 46px; height: 46px; font-family: var(--display); background: #fff; border: 4px solid var(--ink); border-radius: 50%; }
    .lb-row .nm { overflow-wrap: anywhere; }
    .lb-row .fire { font-size: .8em; }
    .lb-row .sc { font-family: var(--display); }
    .lb-title { font-family: var(--display); font-size: clamp(2rem, 5vw, 3.2rem); text-align: center; text-shadow: 0 4px 0 var(--ink); margin: 0 0 20px; }

    /* Podium */
    .podium { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 2vw, 22px); margin-top: 26px; }
    .podium-place { display: grid; justify-items: center; gap: 6px; width: min(28vw, 240px); opacity: 0; transform: translateY(40px); transition: opacity .5s ease, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
    .podium-place.show { opacity: 1; transform: none; }
    .podium-place .who { font-family: var(--display); font-size: clamp(1.2rem, 2.6vw, 2rem); text-align: center; overflow-wrap: anywhere; }
    .podium-place .pts { font-weight: 800; font-size: 1.2rem; }
    .podium-place .block { display: grid; place-items: start center; width: 100%; padding-top: 10px; font-family: var(--display); font-size: 2.6rem; color: var(--ink); border: 5px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; }
    .podium-place[data-place="1"] .block { height: 220px; background: var(--bulb); }
    .podium-place[data-place="2"] .block { height: 160px; background: #D9DCE8; }
    .podium-place[data-place="3"] .block { height: 120px; background: var(--orange); }
    .final-list { max-width: 640px; margin: 34px auto 0; }
    .final-list .lb-row { font-size: 1.2rem; box-shadow: 0 4px 0 var(--ink); }

    /* Player phone */
    .phone .answer-pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .answer-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 140px; padding: 12px; font: inherit; font-weight: 800; font-size: 1.05rem; line-height: 1.15; color: var(--ink); background: var(--c); border: 5px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); cursor: pointer; overflow-wrap: anywhere; }
    .answer-btn:active { transform: translateY(7px); box-shadow: none; }
    .answer-btn .shape-icon { width: 2.4em; height: 2.4em; }
    .phone-q { margin: 0 0 14px; font-weight: 800; font-size: 1.2rem; line-height: 1.2; }
    .phone-clock { float: right; font-family: var(--display); }
    .center-msg { text-align: center; padding: 26px 10px; }
    .center-msg .big { font-size: 4.5rem; line-height: 1; }
    .spinner { width: 54px; height: 54px; margin: 16px auto; border: 7px solid rgba(255, 248, 231, .25); border-top-color: var(--bulb); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .feedback { text-align: center; padding: 30px 16px; color: var(--ink); border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); }
    .feedback.correct { background: var(--lime); }
    .feedback.wrong { background: var(--tomato); color: var(--paper); animation: shake .5s ease; }
    .feedback .big { font-size: 4.5rem; line-height: 1; }
    .feedback h2 { font-family: var(--display); font-size: 2rem; margin: 8px 0; }
    .feedback .points { font-family: var(--display); font-size: 2.6rem; animation: pop-in .4s cubic-bezier(.2, 1.4, .4, 1) .2s both; }
    .feedback .streak { margin-top: 8px; font-weight: 800; font-size: 1.3rem; }
    .feedback .total { margin-top: 12px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="trivia-top">
      <div>
        <div class="trivia-title">🏆 Trivia Live</div>
        <div class="trivia-sub" id="sub"></div>
      </div>
      <div class="row" id="top-actions"><a class="btn btn-ghost" href="/" id="home-link">Hub home</a></div>
    </div>
    <div id="app"></div>
  </main>
  <script type="module" src="assets/trivia-page.js"></script>
</body>
</html>
