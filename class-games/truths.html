<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two truths and a lie · Submit</title><style>body{font:16px/1.5 system-ui;background:#fff4f8;color:#24152a;margin:0;padding:30px}.box{max-width:650px;margin:auto;background:#fff;border:1px solid #f1d5e2;border-radius:18px;padding:28px;box-shadow:0 12px 30px #24152a12}h1{letter-spacing:-.04em}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #d5c4ce;border-radius:9px;font:inherit}button{display:inline-block;margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:#e95091;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:15px;color:#167a63}a{color:#e95091}</style></head><body><main class="box"><p><a href="/dashboard.html">← Trainer dashboard</a></p><h1>🎭 Two truths and a lie</h1><p>Write two true statements about yourself. The third statement is generated for you and will be mixed in on the trainer dashboard.</p><form id="form"><label>Your name<input name="name" required placeholder="Alex"></label><label>Truth one<input name="truth1" required placeholder="I have visited Japan"></label><label>Truth two<input name="truth2" required placeholder="I can juggle"></label><button>Send to the dashboard</button></form><p class="status" id="status"></p></main><script type="module">import{paths,write,id}from'../activity-store.js';const lies=['I once won a national cheese-rolling championship.','I can name every country in reverse alphabetical order.','I have a secret talent for solving a Rubik’s Cube blindfolded.','I was briefly the voice of a cartoon penguin.'];form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const lie=lies[Math.floor(Math.random()*lies.length)];await write(`${paths.truths}/${id('truths')}`,{name:d.name,items:[{text:d.truth1,isLie:false},{text:d.truth2,isLie:false},{text:lie,isLie:true}],submittedAt:Date.now()});form.reset();status.textContent='Submitted — your trainer can reveal the lie from the dashboard.'}</script></body></html>
