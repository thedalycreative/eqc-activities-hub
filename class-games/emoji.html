<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji Guess · Add a clue</title><style>body{font:16px/1.5 system-ui;background:#f6f4ff;color:#182033;margin:0;padding:30px}.box{max-width:620px;margin:auto;background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:28px;box-shadow:0 12px 30px #18203312}h1{letter-spacing:-.04em}label{display:block;font-weight:700;margin:16px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd0dc;border-radius:9px;font:inherit}button,.link{display:inline-block;margin-top:18px;padding:12px 16px;border:0;border-radius:9px;background:#635bff;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.status{margin-top:15px;color:#167a63}</style></head><body><main class="box"><p><a href="/dashboard.html">← Trainer dashboard</a></p><h1>😀 Add an emoji guess</h1><p>Choose something the class can guess: a word, movie, book, TV show, place or song.</p><form id="form"><label>Your name<input name="contributor" required placeholder="Alex"></label><label>Category<select name="category"><option>Movie</option><option>Book</option><option>TV show</option><option>Word</option><option>Song</option><option>Other</option></select></label><label>Answer<input name="answer" required placeholder="The Lion King"></label><label>Emoji clue<input name="clue" required placeholder="🦁👑🌅"></label><button>Add to dashboard</button></form><p class="status" id="status"></p></main><script type="module">import{paths,write,id}from'../activity-store.js';form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));await write(`${paths.emoji}/${id('emoji')}`,{...d,submittedAt:Date.now()});form.reset();status.textContent='Added — ask the trainer to switch to the dashboard.'}</script></body></html>
